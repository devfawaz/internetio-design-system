name: tokens
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run build
      - name: dist is committed and up to date
        run: git diff --exit-code -- dist docs/tokens.data.js
      - run: npm run validate
      - run: node scripts/check.mjs docs/docs.css --max 0
